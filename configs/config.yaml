data:
  url: https://files.grouplens.org/datasets/movielens/ml-100k.zip
  seed: 42
paths:
  raw: data/raw
  processed: data/processed
  features: data/features
  errors: data/errors
  models: models
  reports: reports
validation:
  use_faulty_data: true
  rating_min: 1
  rating_max: 5
  age_min: 5
  age_max: 100
  min_valid_timestamp: 631152000   # 1990-01-01
split:
  test_fraction: 0.2   # latest 20% of interactions (by time) become the test set
features:
  version: "1.0"
models:
  svd:
    n_components: 20
    random_state: 42
evaluation:
  k: 10
  relevance_threshold: 4   # test ratings >= 4 count as relevant
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: recommendation-pipeline
